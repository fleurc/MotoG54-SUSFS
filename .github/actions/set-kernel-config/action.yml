name: Set Kernel Config
description: Patch gki_defconfig directly (add or modify entries)

inputs:
  config_list:
    required: true
    description: "Kernel config lines"

runs:
  using: composite
  steps:
  - name: Patch gki_defconfig
    shell: bash
    working-directory: ${{ github.workspace }}/kernel/common
    run: |
      set -euo pipefail

      DEFCONFIG="arch/arm64/configs/gki_defconfig"
      CONFIG_LIST="${{ inputs.config_list }}"

      if [ ! -f "$DEFCONFIG" ]; then
        echo "ERROR: gki_defconfig not found"
        exit 1
      fi

      apply_line() {
        local line="$1"
        line="$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

        # Skip empty lines and comments.
        [[ -z "$line" || "$line" == \#* ]] && return

        local key value
        if [[ "$line" == *"="* ]]; then
          key="${line%%=*}"
          value="${line#*=}"
        else
          key="$line"
          value="y"
        fi

        # Accept only valid Kconfig symbol names. This also makes the sed
        # expression safe when config_list is supplied by another action.
        if [[ ! "$key" =~ ^CONFIG_[A-Za-z0-9_]+$ ]]; then
          echo "ERROR: invalid Kconfig symbol: $key" >&2
          return 1
        fi

        echo "Processing: $key=$value"

        if grep -q "^${key}=" "$DEFCONFIG"; then
          sed -i "s|^${key}=.*|${key}=${value}|g" "$DEFCONFIG"
        elif grep -q "^# ${key} is not set$" "$DEFCONFIG"; then
          sed -i "s|^# ${key} is not set$|${key}=${value}|g" "$DEFCONFIG"
        else
          printf '%s=%s\\n' "$key" "$value" >> "$DEFCONFIG"
        fi
      }

      while IFS= read -r line || [ -n "$line" ]; do
        apply_line "$line"
      done <<< "$CONFIG_LIST"
