name: Auto-fix failed kernel build

on:
  workflow_run:
    workflows: ["Build Kernels"]
    types: [completed]

jobs:
  diagnose-fix:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read

    steps:
      - uses: actions/checkout@v4

      - name: Download failed logs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .ci
          gh run view ${{ github.event.workflow_run.id }} --log-failed > .ci/failing.log

      - name: Check for known failure signatures
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -Eq 'Executable "ld" doesn.t exist|KernelSU requires either CONFIG_KPROBES=y or CONFIG_KSU_SUSFS=y' .ci/failing.log; then
            echo "No known failure signature found; skipping auto-fix."
            exit 0
          fi

      - name: Apply build fix
        shell: bash
        run: |
          set -euo pipefail

          cat > .github/actions/build-kernel/action.yml <<'YAML'
          name: 'Build Kernel'
          description: 'Builds kernel using legacy build.sh or Bazel (kleaf)'
          inputs:
            version:
              description: 'Kernel config version (e.g., android14-6.1)'
              required: true

          runs:
            using: composite
            steps:
            - name: Setup Kernel Configs
              if: false
              uses: ./.github/actions/set-kernel-config

            - name: 'Build Kernel'
              shell: bash
              working-directory: ${{ github.workspace }}/kernel
              run: |
                set -euo pipefail

                export PATH="/usr/bin:/bin:${PATH}"
                export ADDITIONAL_HOST_TOOLS="${ADDITIONAL_HOST_TOOLS:-} /usr/bin/ld /usr/bin/dd"

                export CONFIG_KSU=y
                export CONFIG_KSU_SUSFS=y

                sed -i 's/check_defconfig//' ./common/build.config.gki

                DEFCONFIG_FILE="common/arch/arm64/configs/gki_defconfig"
                if [ ! -f "$DEFCONFIG_FILE" ]; then
                  echo "ERROR: $DEFCONFIG_FILE not found!" >&2
                  exit 1
                fi

                set_config() {
                  local key="$1" value="$2"
                  if grep -q "^${key}=" "$DEFCONFIG_FILE"; then
                    sed -i "s|^${key}=.*|${key}=${value}|" "$DEFCONFIG_FILE"
                  elif grep -q "^# ${key} is not set$" "$DEFCONFIG_FILE"; then
                    sed -i "s|^# ${key} is not set$|${key}=${value}|" "$DEFCONFIG_FILE"
                  else
                    printf '%s=%s\n' "$key" "$value" >> "$DEFCONFIG_FILE"
                  fi
                }

                set_config CONFIG_KSU y
                set_config CONFIG_KSU_SUSFS y

                if [ -f "build/build.sh" ]; then
                  BUILD_GKI_ARTIFACTS="" \
                  BUILD_GKI_CERTIFICATION_TOOLS=0 \
                  BUILD_SYSTEM_DLKM=0 \
                  SKIP_VENDOR_BOOT=1 \
                  SKIP_EXT_MODULES=1 \
                  SKIP_CP_KERNEL_HDR=1 \
                  OUT_DIR="/home/runner/out" \
                  LTO=thin \
                  BUILD_CONFIG=common/build.config.gki.aarch64 \
                  ADDITIONAL_HOST_TOOLS="$ADDITIONAL_HOST_TOOLS" \
                  CC="/usr/bin/ccache clang" \
                  CXX="/usr/bin/ccache clang++" \
                  HOSTCC="/usr/bin/ccache clang" \
                  HOSTCXX="/usr/bin/ccache clang++" \
                  build/build.sh -j"$(nproc)"
                else
                  sed -i '/name = "kernel_aarch64",/a\    check_defconfig = "disabled",' common/BUILD.bazel
                  tools/bazel build \
                    --config=fast \
                    --disk_cache=/home/runner/.cache/bazel \
                    //common:kernel_aarch64/Image
                fi

            - name: 'Gather Build Artifacts'
              shell: bash
              working-directory: ${{ github.workspace }}/kernel
              run: |
                set -euo pipefail
                if [ -f "bazel-bin/common/kernel_aarch64/Image" ]; then
                  echo "Found Image at bazel-bin/common/kernel_aarch64/Image"
                  cp "bazel-bin/common/kernel_aarch64/Image" "${{ github.workspace }}/AnyKernel3/Image"
                  exit 0
                fi
                if [ -f "/home/runner/out/dist/Image" ]; then
                  echo "Found Image at /home/runner/out/dist/Image"
                  cp "/home/runner/out/dist/Image" "${{ github.workspace }}/AnyKernel3/Image"
                  exit 0
                fi

                exit 1
          YAML

          cat > .github/actions/set-kernel-config/action.yml <<'YAML'
          name: Set Kernel Config
          description: Patch gki_defconfig directly (add or modify entries)

          inputs:
            config_list:
              required: true
              description: "Kernel config lines"

          runs:
            using: composite
            steps:
            - name: Patch gki_defconfig
              shell: bash
              working-directory: ${{ github.workspace }}/kernel/common
              run: |
                set -euo pipefail

                DEFCONFIG="arch/arm64/configs/gki_defconfig"
                CONFIG_LIST="${{ inputs.config_list }}"

                if [ ! -f "$DEFCONFIG" ]; then
                  echo "ERROR: gki_defconfig not found"
                  exit 1
                fi

                apply_line() {
                  local line="$1"
                  line="$(echo "$line" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"

                  [[ -z "$line" || "$line" == \#* ]] && return

                  local key value
                  if [[ "$line" == *"="* ]]; then
                    key="${line%%=*}"
                    value="${line#*=}"
                  else
                    key="$line"
                    value="y"
                  fi

                  if [[ ! "$key" =~ ^CONFIG_[A-Za-z0-9_]+$ ]]; then
                    echo "ERROR: invalid Kconfig symbol: $key" >&2
                    return 1
                  fi

                  echo "Processing: $key=$value"

                  if grep -q "^${key}=" "$DEFCONFIG"; then
                    sed -i "s|^${key}=.*|${key}=${value}|g" "$DEFCONFIG"
                  elif grep -q "^# ${key} is not set$" "$DEFCONFIG"; then
                    sed -i "s|^# ${key} is not set$|${key}=${value}|g" "$DEFCONFIG"
                  else
                    printf '%s=%s\n' "$key" "$value" >> "$DEFCONFIG"
                  fi
                }

                while IFS= read -r line || [ -n "$line" ]; do
                  apply_line "$line"
                done <<< "$CONFIG_LIST"
          YAML

      - name: Commit and PR fix
        shell: bash
        run: |
          set -euo pipefail
          git checkout -b fix/hermetic-kernel-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/actions/build-kernel/action.yml .github/actions/set-kernel-config/action.yml
          if git diff --cached --quiet; then
            echo "No patch required."
            exit 0
          fi
          git commit -m "fix: restore host linker and clean-phase config handling"
          git push --set-upstream origin fix/hermetic-kernel-build
          gh pr create --title "Fix hermetic linker and clean-phase KSU config" --body "This PR fixes the failing kernel build by restoring ld/dd availability and preventing clean-phase KSU config validation from failing." --fill
